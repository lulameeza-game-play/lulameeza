<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark}html,body{margin:0}body{font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>لولاميزا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e1a2b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap">
<style>
:root{
  --bg:#0e1a2b; --panel:#16294a; --panel2:#1d3856; --ink:#f6efe0; --muted:#9fb0c6;
  --gold:#f2b632; --red:#e0405a; --green:#2fbf8f; --line:#2a4466; --tile:#1a3050;
  --f-display:'Lalezar','Cairo',system-ui,sans-serif;
  --f-body:'Cairo','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark; direction:rtl;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;min-height:100svh;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(1100px 500px at 85% -10%,#1f4070 0,transparent 60%),radial-gradient(900px 500px at 0% 110%,#2f1d45 0,transparent 55%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn{background:var(--gold);color:#2a1a00;font-weight:800;padding:10px 18px;border-radius:12px;box-shadow:0 3px 0 #a87a10;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a87a10}
.btn.alt{background:#2a4a70;color:var(--ink);box-shadow:0 3px 0 #0e1d30}
.btn.bad{background:var(--red);color:#fff;box-shadow:0 3px 0 #8d1d33}
.btn.good{background:var(--green);color:#022a1e;box-shadow:0 3px 0 #17775a}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.app{display:grid;gap:14px;max-width:1280px;margin:0 auto}
@media(min-width:1000px){.app{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.boardwrap{display:grid;place-items:center}
.board{position:relative;width:min(100%,calc(100svh - 28px));aspect-ratio:1;container-type:inline-size;display:grid;
  grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;direction:ltr;
  background:#0b1626;border:3px solid var(--gold);border-radius:10px;box-shadow:0 20px 60px #0009}
.tile{position:relative;background:var(--tile);border:1px solid #0b1626;display:flex;flex-direction:column;overflow:hidden;direction:rtl;text-align:center;cursor:pointer;min-width:0;min-height:0}
.tile .band{height:24%;background:var(--c);display:flex;justify-content:center;align-items:center;gap:.2cqw;font-size:1.7cqw;line-height:1}
.tile .nm{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.3cqw;font-weight:700;line-height:1.15;padding:0 2px}
.tile .ic{font-size:2.3cqw;line-height:1;padding-top:.3cqw}
.tile .pr{font-size:1.2cqw;color:var(--gold);font-weight:700;padding-bottom:.3cqw}
.tile.corner{background:#22406a}
.tile.corner .nm{font-size:1.5cqw}.tile.corner .ic{font-size:3.6cqw}
.tile.owned{box-shadow:inset 0 0 0 .45cqw var(--oc)}
.tile.mort{filter:grayscale(1) brightness(.7)}
.tile.mort::after{content:"مرهون";position:absolute;inset:auto 0 30% 0;background:#000a;font-size:1.2cqw;color:#fff}
.tile.hl{animation:hl .9s ease-in-out 2}
@keyframes hl{50%{background:#5a4a10}}
@container (max-width:640px){.tile .nm{display:none}.tile .pr{font-size:2.1cqw}.tile .ic{font-size:3.6cqw}.tile.corner .ic{font-size:5cqw}.tile .band{font-size:2.4cqw}.tile.mort::after{display:none}}
.tok{position:absolute;width:4.6cqw;height:4.6cqw;font-size:3.2cqw;transform:translate(-50%,-50%);z-index:5;display:grid;place-items:center;border-radius:50%;
  background:var(--pc);border:.3cqw solid #fff;box-shadow:0 .4cqw 1cqw #000a;transition:left .16s linear,top .16s linear;line-height:1}
.tok.on{z-index:7;outline:.35cqw solid var(--gold)}
.tok span{display:block}
.fl{position:absolute;transform:translate(-50%,-50%);z-index:9;font-family:var(--f-display);font-size:3.2cqw;pointer-events:none;animation:floatUp 1.3s ease-out forwards;text-shadow:0 2px 6px #000;white-space:nowrap}
.fl.p{color:#6dffb8}.fl.m{color:#ff7a8d}
.center{grid-area:2/2/11/11;direction:rtl;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;padding:1cqw;
  background:linear-gradient(#10243d 40%,#25406a);overflow:hidden}
.center>*{position:relative;z-index:2}
.pyr{position:absolute!important;bottom:0;background:linear-gradient(#f2c04a,#a87420);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.85;z-index:1!important}
.sun{position:absolute!important;top:7%;left:12%;width:9cqw;height:9cqw;border-radius:50%;background:radial-gradient(#ffe9a0,#f2b632 60%,transparent 62%);z-index:1!important;animation:pulse 4s ease-in-out infinite}
.logo{font-family:var(--f-display);font-size:clamp(20px,5.2cqw,60px);color:var(--gold);line-height:1;text-shadow:0 .4cqw 0 #6b4a05,0 0 3cqw #f2b63255;transform:rotate(-3deg)}
.status{font-family:var(--f-display);font-size:clamp(14px,2.6cqw,30px);text-align:center;min-height:2.6em;display:grid;place-items:center;max-width:90%}
.dice{display:flex;gap:2.4cqw}
.die{width:7.4cqw;height:7.4cqw;background:#fff;border-radius:1.3cqw;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:.7cqw;box-shadow:0 .6cqw 0 #b9b2a0,0 1cqw 2cqw #0008}
.pip{border-radius:50%;margin:14%}.pip.on{background:#1b1b1b}
.die.roll{animation:tumble .45s linear infinite}
.center .btn{font-size:clamp(14px,2.3cqw,26px);padding:.9em 2em}
.acts{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}
.panel{display:grid;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.h{font-family:var(--f-display);font-size:21px;margin:0 0 8px;color:var(--gold);font-weight:400}
.pl{display:grid;gap:8px}
.pc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel2);border:2px solid transparent}
.pc.me{border-color:var(--pcol);box-shadow:0 0 18px -4px var(--pcol)}
.pc.out{opacity:.4;filter:grayscale(1)}
.pc .tk{font-size:26px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--pcol)}
.pc b{display:block;line-height:1.2}.pc small{color:var(--muted)}
.cash{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.log{max-height:190px;overflow:auto;display:grid;gap:4px;font-size:13.5px}
.log div{padding:5px 9px;border-radius:8px;background:#102038}
.log div:first-child{background:#27456b}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#050a14d9;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:fade .2s}
.sheet{width:min(540px,100%);max-height:92svh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;animation:popIn .35s cubic-bezier(.3,1.5,.5,1) both;display:grid;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--gold)}
.sheet p{margin:0;line-height:1.7}
.deed{background:#f6efe0;color:#1e1e1e;border-radius:10px;overflow:hidden;border:2px solid #111}
.deed .top{padding:10px;text-align:center;background:var(--c);color:var(--tc,#fff);font-family:var(--f-display);font-size:24px;line-height:1.1}
.deed .top small{display:block;font-family:var(--f-body);font-size:12px;opacity:.85}
.deed .rw{display:flex;justify-content:space-between;padding:3px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.deed .rw:nth-child(even){background:#0001}
.flip{perspective:900px;display:grid;place-items:center}
.card{width:min(300px,86%);min-height:190px;border-radius:16px;padding:18px;display:grid;place-items:center;text-align:center;font-size:18px;line-height:1.7;font-weight:700;animation:flipIn .7s cubic-bezier(.3,1.2,.5,1) both;border:4px solid #fff3;box-shadow:0 14px 40px #0008}
.card .ct{font-family:var(--f-display);font-size:28px;display:block;margin-bottom:6px;font-weight:400}
.card.ch{background:linear-gradient(135deg,#ffb347,#e0405a);color:#2a0710}
.card.cc{background:linear-gradient(135deg,#6ee7b7,#2f8fbf);color:#04202a}
.grp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp .gh{padding:6px 10px;background:var(--c);color:var(--tc,#fff);font-weight:800;font-size:13px}
.prow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 10px;background:var(--panel2);border-top:1px solid #0003;flex-wrap:wrap}
.prow .n{font-weight:700}.prow .lv{font-size:15px;letter-spacing:1px}
.cut{position:fixed;inset:0;z-index:80;display:grid;place-items:center;align-content:center;gap:10px;cursor:pointer;animation:fade .25s;text-align:center;padding:16px;
  background:radial-gradient(circle at 50% 40%,var(--m1,#2a4a80),var(--m2,#0b1426) 75%)}
.cut .stage{position:relative;width:min(560px,94vw);height:min(44svh,300px);overflow:hidden}
.cut h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,56px);color:var(--gold);text-shadow:0 4px 0 #0007;line-height:1.1;animation:popIn .5s .15s cubic-bezier(.3,1.6,.5,1) both}
.cut p{margin:0;font-size:clamp(15px,3.6vw,20px);max-width:520px;line-height:1.7;animation:fade .6s .4s both}
.cut small{color:var(--muted);animation:blink 1.4s 1.2s infinite both}
.actor{position:absolute;line-height:1;transform-origin:50% 100%}
.a-drive{animation:driveIn .9s cubic-bezier(.2,.8,.2,1) both}
.a-pop{animation:popIn .55s cubic-bezier(.3,1.6,.5,1) both}
.a-bounce{animation:bounce .6s ease-in-out infinite}
.a-shake{animation:shake .35s linear infinite}
.a-blink{animation:blink .35s steps(2) infinite}
.a-rain{animation:rain 1.7s linear infinite}
.a-rise{animation:rise .9s cubic-bezier(.2,1.3,.4,1) both}
.a-spin{animation:spin 1.2s linear infinite}
.a-float{animation:floatUp 1.7s ease-out infinite}
.a-fly{animation:fly 1.2s ease-in-out infinite}
.a-stamp{animation:stamp .5s .35s cubic-bezier(.3,1.8,.5,1) both}
.a-sway{animation:sway 1.2s ease-in-out infinite}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:90;animation:cfall linear infinite;pointer-events:none}
.setup{max-width:560px;margin:2vh auto;display:grid;gap:14px}
.setup .hero{text-align:center;display:grid;gap:6px;padding-block:8px}
.setup h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,84px);color:var(--gold);line-height:1;text-shadow:0 5px 0 #6b4a05,0 0 40px #f2b63266;transform:rotate(-2deg)}
.setup .tag{color:var(--muted);font-size:16px}
.prs{display:grid;gap:8px}
.pr-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--panel2);padding:8px;border-radius:12px}
.pr-row input[type=text]{background:#0e1d33;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;min-width:0;width:100%}
.pr-row .tkb{font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--pcol)}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.seg button{padding:7px 10px;background:#0e1d33;font-size:13px;font-weight:700}
.seg button.on{background:var(--gold);color:#2a1a00}
.tip{font-size:13px;color:var(--muted);line-height:1.7}
@keyframes fade{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes flipIn{from{opacity:0;transform:rotateY(90deg) scale(.7)}to{opacity:1;transform:none}}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(100deg) translateY(-1.4cqw)}50%{transform:rotate(200deg) translateY(0)}75%{transform:rotate(290deg) translateY(-1cqw)}100%{transform:rotate(360deg) translateY(0)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-260%)}}
@keyframes driveIn{from{transform:translateX(120vw)}}
@keyframes bounce{50%{transform:translateY(-16px)}}
@keyframes shake{25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
@keyframes blink{50%{opacity:.15}}
@keyframes rain{from{transform:translateY(-70px) rotate(0)}to{transform:translateY(360px) rotate(360deg)}}
@keyframes rise{from{transform:translateY(140px) scaleY(.1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{0%,100%{transform:translateX(var(--x0,-90px))}50%{transform:translateX(var(--x1,90px)) translateY(-26px)}}
@keyframes stamp{from{opacity:0;transform:scale(4) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(-10deg)}}
@keyframes sway{50%{transform:rotate(8deg)}0%,100%{transform:rotate(-8deg)}}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

body{background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 15%,#fff7,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff6,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff6,transparent);animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.35}}
.app,.setup{position:relative;z-index:1}
.btn.big{font-size:19px;padding:14px 18px;border-radius:14px;width:100%}
.tile{background:linear-gradient(160deg,#21406a,#162b4a);transition:filter .2s}
.tile:hover{filter:brightness(1.25)}
.tile .fe{position:absolute;inset:26% 0 24% 0;display:grid;place-items:center;font-size:3.4cqw;opacity:.32;pointer-events:none;filter:saturate(1.2)}
.tile.k-st .fe,.tile.k-ut .fe{inset:18% 0 30% 0;font-size:3.6cqw;opacity:.28}
.tile .nm,.tile .pr,.tile .ic{position:relative;z-index:1}
.tile .band{gap:.15cqw;box-shadow:inset 0 -.25cqw 0 #0004;min-height:24%}
.hs{display:inline-block;width:1.5cqw;height:1.5cqw;background:linear-gradient(#5ed17a,#1f9a47);clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%);filter:drop-shadow(0 .15cqw 0 #0006)}
.ht{display:inline-block;width:3.3cqw;height:1.7cqw;background:linear-gradient(#ff6b7e,#c1213a);border-radius:.3cqw;box-shadow:0 .2cqw 0 #6d0f1f;position:relative}
.ht::after{content:"";position:absolute;inset:25% 12%;background:repeating-linear-gradient(90deg,#ffe38a 0 .35cqw,transparent .35cqw .8cqw)}
.hs.new,.ht.new{animation:popIn .6s cubic-bezier(.3,1.7,.5,1) both}
@container (max-width:640px){.hs{width:2.1cqw;height:2.1cqw}.ht{width:4.4cqw;height:2.3cqw}.tile .fe{font-size:4.2cqw}}
.tile.owned{box-shadow:inset 0 0 0 .45cqw var(--oc),0 0 1.4cqw -.2cqw var(--oc)}
.tile.corner{background:linear-gradient(160deg,#315a93,#1d3a63)}
.tile.hl{animation:hl .9s ease-in-out 2}
.tok span{display:inline-block}
.tok.on{box-shadow:0 0 0 .45cqw var(--gold),0 0 2.4cqw var(--gold)}
.pt{position:absolute;z-index:9;pointer-events:none;font-size:2cqw;transform:translate(-50%,-50%);animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
.rx{position:absolute;bottom:2%;z-index:9;display:grid;place-items:center;pointer-events:none;animation:rxUp 2.2s ease-out forwards}
.rx span{font-size:7cqw;filter:drop-shadow(0 .5cqw .8cqw #0009)}
.rx small{font-size:1.5cqw;background:#000a;color:#fff;border-radius:99px;padding:0 1cqw}
@keyframes rxUp{from{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1;transform:translateY(-4cqw) scale(1.1)}to{transform:translateY(-34cqw) scale(1);opacity:0}}
.rxrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rxb{font-size:22px;background:var(--panel2);border-radius:10px;padding:4px 10px;transition:transform .1s}
.rxb:active{transform:scale(1.3)}
.nile{position:absolute!important;left:0;right:0;bottom:0;height:20%;background:repeating-linear-gradient(100deg,#2a6fb0 0 2.4cqw,#3a86c8 2.4cqw 4.8cqw);opacity:.75;z-index:1!important;animation:wave 3s linear infinite}
@keyframes wave{to{background-position:9.6cqw 0}}
.boat{position:absolute!important;bottom:11%;font-size:5cqw;z-index:2!important;animation:sail 14s linear infinite}
@keyframes sail{from{left:-8%}to{left:104%}}
.center .status{background:#0007;border-radius:1.4cqw;padding:.4cqw 1.6cqw}
.die{background:linear-gradient(145deg,#fff,#e4dcc8)}
.die.roll{animation:tumble .4s linear infinite}
.fame{display:flex;gap:12px;align-items:center;padding:8px 14px;background:#fff6d6;border-bottom:1px solid #0002}
.fame>span{font-size:34px}
.fame small{display:block;color:#5a4a1c;line-height:1.5;margin-top:2px}
.cut .bar{width:min(480px,86vw);height:6px;border-radius:9px;background:#fff2;overflow:hidden}
.cut .bar i{display:block;height:100%;width:0;background:var(--gold)}
.cut p{min-height:3.4em;animation:fade .5s both}
.a-gavel{animation:gavel .8s ease-in-out infinite;transform-origin:90% 90%}
@keyframes gavel{0%,100%{transform:rotate(-40deg)}45%{transform:rotate(15deg)}}
.cut .stage{background:linear-gradient(#0000,#0003);border-radius:16px}
.toast{position:fixed;left:50%;bottom:max(70px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;z-index:120;max-width:90vw;text-align:center;animation:popIn .3s both}
#musWrap{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;justify-items:start;direction:rtl}
#musBtn{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#2a1a00;font-size:22px;box-shadow:0 4px 14px #0008}
#musPanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;width:min(300px,calc(100vw - 32px));box-shadow:0 10px 30px #000a}
#musPanel[hidden]{display:none}
.vol{display:flex;gap:8px;align-items:center}.vol input{flex:1;accent-color:var(--gold)}
#musPanel .seg{flex-wrap:wrap}#musPanel .seg button{flex:1 1 auto}
.menuhero{position:relative;height:clamp(250px,42svh,340px);border-radius:20px;overflow:hidden;border:2px solid var(--gold);background:linear-gradient(#16316a 0%,#7a4a9a 45%,#f08a48 82%,#f2b632);box-shadow:0 16px 50px #0009;container-type:inline-size}
.menuhero h1{position:absolute;top:12%;left:0;right:0;margin:0;text-align:center;font-family:var(--f-display);font-weight:400;font-size:clamp(54px,18cqw,100px);line-height:1;color:var(--gold);text-shadow:0 5px 0 #6b4a05,0 0 40px #f2b63288;transform:rotate(-2deg);animation:logoIn .9s cubic-bezier(.3,1.5,.5,1) both;z-index:5}
@keyframes logoIn{from{opacity:0;transform:scale(.3) rotate(-14deg)}}
.m-sub{position:absolute;top:calc(12% + clamp(60px,20cqw,106px));left:0;right:0;text-align:center;color:#fff;font-weight:700;z-index:5;text-shadow:0 2px 6px #0008;padding:0 12px;animation:fade 1s .5s both}

<script>
/* ====== اتصال مستقل عبر WebRTC (PeerJS) مع اكتشاف تلقائي للغرفة وتوريث المضيف ====== */
(function(){
 window.STANDALONE=true;
 const CFGS=[{url:'wss://broker.emqx.io:8084/mqtt'},{url:'wss://broker.hivemq.com:8884/mqtt'},{url:'wss://test.mosquitto.org:8081/'}];
 const MQTT_SRC=['https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'];
 const err=(code,message)=>({code,message:message||code});
 function load(){
  if(window.mqtt)return Promise.resolve();
  const one=src=>new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(err('upstream_error','mqtt'));document.head.appendChild(t);});
  return one(MQTT_SRC[0]).catch(()=>one(MQTT_SRC[1]));
 }
 /* نقل الرسائل عبر وسيط MQTT عام (بدون WebRTC عشان يشتغل على شبكات الموبايل) */
 function MPeer(idHint,cfg){
  const self=this,ev={};
  self.on=(e,f)=>{(ev[e]=ev[e]||[]).push(f);return self;};
  const emit=(e,...a)=>(ev[e]||[]).slice().forEach(f=>{try{f(...a);}catch(x){}});
  const code=String(idHint).split('-')[1]||'X';
  const id='m'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
  self.id=id;window.__MP=self;self.ev=[];const LG=(...a)=>{self.ev.push([Date.now()%1000000,...a]);};self.stat={out:0,in:0,lastIn:0,reconn:0,off:0};
  const base='lulameeza-v1/'+code,lobby=base+'/lobby',mine=base+'/to/'+id;
  const seen=new Map(),conns=new Map();
  let cli=null,closed=false,hb=null,opened=false;
  self.known=()=>[...seen.keys()];
  const pub=(t,o)=>{try{self.stat.out++;if(cli&&cli.connected)cli.publish(t,JSON.stringify(o),{qos:1});}catch(e){}};
  const touch=r=>{if(r&&r!==id)seen.set(r,Date.now());};
  function mkConn(rid){
   const cev={};
   const c={peer:rid,open:false,dead:false,
    on(e,f){(cev[e]=cev[e]||[]).push(f);return c;},
    send(m){if(!closed)pub(base+'/to/'+rid,{k:'d',f:id,m});},
    close(){if(c.dead)return;if(c.open)pub(base+'/to/'+rid,{k:'x',f:id});kill();},
    _e(e,...a){(cev[e]||[]).slice().forEach(f=>{try{f(...a);}catch(x){}});},
    _open(){if(c.open||c.dead)return;c.open=true;c._e('open');}};
   function kill(){if(c.dead)return;LG('kill',rid);c.dead=true;const was=c.open;c.open=false;if(conns.get(rid)===c)conns.delete(rid);c._e('close');}
   c._kill=kill;conns.set(rid,c);return c;
  }
  self.connect=rid=>{
   const old=conns.get(rid);
   if(old&&old.open)return old;
   if(old){old.dead=true;conns.delete(rid);}
   const c=mkConn(rid);
   pub(base+'/to/'+rid,{k:'syn',f:id});
   return c;
  };
  const onMsg=(topic,buf)=>{
   let m;try{m=JSON.parse(buf.toString());}catch(e){return;}
   if(!m||!m.f||m.f===id)return;
   touch(m.f);
   if(topic===lobby){
    if(m.k==='bye'){LG('bye',m.f);seen.delete(m.f);const c=conns.get(m.f);if(c)c._kill();}
    return;
   }
   if(m.k==='syn'){
    let c=conns.get(m.f);
    if(!c||c.dead){c=mkConn(m.f);emit('connection',c);setTimeout(()=>c._open(),0);}
    else setTimeout(()=>c._open(),0);
    pub(base+'/to/'+m.f,{k:'ack',f:id});
   }else if(m.k==='ack'){const c=conns.get(m.f);if(c)c._open();}
   else if(m.k==='d'){const c=conns.get(m.f);if(c&&c.open)c._e('data',m.m);else{LG('DROPd',m.f,!!c,c&&c.open);pub(base+'/to/'+m.f,{k:'x',f:id});}}
   else if(m.k==='x'){LG('Xrecv',m.f);const c=conns.get(m.f);if(c)c._kill();}
  };
  try{
   cli=mqtt.connect(cfg.url,{clientId:'lz_'+id,clean:true,reconnectPeriod:2000,connectTimeout:7000,keepalive:20,
    will:{topic:lobby,payload:JSON.stringify({k:'bye',f:id}),qos:0}});
  }catch(e){setTimeout(()=>emit('error',{type:'network'}),0);return;}
  cli.on('message',(t,b)=>{self.stat.in++;self.stat.lastIn=Date.now();onMsg(t,b);});
  cli.on('reconnect',()=>self.stat.reconn++);cli.on('offline',()=>self.stat.off++);cli.on('close',()=>{self.stat.closed=(self.stat.closed||0)+1;});
  cli.on('connect',()=>{
   cli.subscribe([lobby,mine],{qos:1},err=>{
    if(err){if(!opened)emit('error',{type:'network'});return;}
    pub(lobby,{k:'here',f:id});
    if(!opened){opened=true;emit('open',id);
     hb=setInterval(()=>{
      if(closed)return;
      pub(lobby,{k:'here',f:id});
      const now=Date.now();
      seen.forEach((t,r)=>{if(now-t>9000){LG('stale',r);seen.delete(r);const c=conns.get(r);if(c)c._kill();}});
      conns.forEach((c,r)=>{if(c.open&&now-(seen.get(r)||0)>9000)c._kill();});
     },2000);}
   });
  });
  cli.on('error',()=>{if(!opened)emit('error',{type:'network'});});
  self.destroy=()=>{closed=true;clearInterval(hb);try{pub(lobby,{k:'bye',f:id});cli.end(true);}catch(e){}};
 }
 async function join(roomCode){
  await load();
  const cleanCode=String(roomCode).replace(/^bk-/i,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const L={},hs=new Set(),cs=new Set();
  const peers=new Map();
  const conns=new Map();
  const seenMsg=new Set();
  let myId=null,dead=false,peer=null,myPres={};
  let isActingHost=false;

  const list=()=>[...peers.entries()].filter(([id,p])=>id===myId||(p.presence&&p.presence.name))
   .sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)||a[0].localeCompare(b[0]))
   .map(([id,p])=>({
    peer:id,
    presence:Object.assign({name:id===myId?(myPres.name||'لاعب'):'لاعب متصل'},p.presence||{}),
    isMe:id===myId,
    sameTab:id===myId,
    kind:'viewer',
    by:null,
    guest:false,
    updatedAt:p.joinedAt||0
   }));

  const emitPeers=(joined=[],left=[])=>{
   const l=list();
   hs.forEach(h=>{try{h({peers:l,joined,left,updated:[]});}catch(e){}});
  };

  const emitConn=()=>{
   const ok=!dead&&!!myId;
   cs.forEach(h=>{try{h(ok);}catch(e){}});
  };

  const deliver=(topic,data,from)=>{
   (window.__LOG=window.__LOG||[]).push([Date.now()%1000000,topic,from===myId?'me':'rem',topic==='pr'?JSON.stringify(data).slice(0,80):'']);
   (L[topic]||[]).slice().forEach(f=>{
    try{f({peer:from,topic,data,isMe:from===myId,sameTab:from===myId,kind:'viewer',by:null,guest:false});}catch(e){}
   });
  };

  const broadcast=(msg,exceptId=null)=>{
   conns.forEach((c,id)=>{
    if(id!==exceptId&&c&&c.open){try{c.send(msg);}catch(e){}}
   });
  };

  const syncPeerTable=()=>{
   const payload=[...peers.entries()].map(([id,v])=>({id,presence:v.presence||{},joinedAt:v.joinedAt||0}));
   broadcast({t:'ptbl',list:payload});
  };

  const connectTo=(targetId)=>{
   if(!peer||dead||!targetId||targetId===myId)return;
   const existing=conns.get(targetId);
   if(existing){
    if(existing.open)return;
    const st=existing.peerConnection&&existing.peerConnection.connectionState;
    if(st==='connecting'||st==='connected')return;
   }
   try{
    const c=peer.connect(targetId,{serialization:'json',reliable:true});
    if(c)attachConn(c,targetId);
   }catch(e){}
  };

  function electHost(){
   if(dead||!myId)return;
   const sorted=[...peers.entries()].sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)||a[0].localeCompare(b[0]));
   const wasHost=isActingHost;
   isActingHost=!!(sorted[0]&&sorted[0][0]===myId);
   if(isActingHost&&!wasHost){
    myPres=Object.assign({},myPres,{host:true});
    peers.set(myId,{presence:myPres,joinedAt:peers.get(myId)?.joinedAt||Date.now()});
    broadcast({t:'pres',p:myPres});
    syncPeerTable();
    deliver('__host_promoted__',{hostPeer:myId},myId);
   }else if(!isActingHost&&wasHost){
    deliver('__host_demoted__',{hostPeer:sorted[0]&&sorted[0][0]},myId);
   }
  }

  const attachConn=(c,remoteId)=>{
   if(!remoteId||remoteId===myId)return;
   const prevConn=conns.get(remoteId);
   if(prevConn&&prevConn!==c&&prevConn.open)return;
   conns.set(remoteId,c);
   if(!peers.has(remoteId))peers.set(remoteId,{presence:{},joinedAt:Date.now()});

   c.on('open',()=>{
    try{c.send({t:'hello',id:myId,p:myPres,joinedAt:peers.get(myId)?.joinedAt||Date.now(),isHost:isActingHost});}catch(e){}
    if(myPres&&myPres.name){
     try{c.send({t:'pres',p:myPres});}catch(e){}
    }
    if(isActingHost)syncPeerTable();
    electHost();
    const joinedItem=list().find(x=>x.peer===remoteId);
    emitPeers(joinedItem?[joinedItem]:[],[]);
   });

   c.on('data',m=>{
    if(!m||dead)return;
    const senderId=m.id||m.from||remoteId;
    if(m.t==='hello'){
     const prev=peers.get(remoteId)||{joinedAt:Date.now()};
     const joinTime=Math.min(prev.joinedAt||Date.now(),m.joinedAt||Date.now());
     peers.set(remoteId,{presence:Object.assign({},prev.presence,m.p||{}),joinedAt:joinTime});
     if(myPres&&myPres.name){
      try{c.send({t:'pres',p:myPres});}catch(e){}
     }
     if(isActingHost)syncPeerTable();
     electHost();
     emitPeers([],[]);
    }else if(m.t==='ptbl'&&Array.isArray(m.list)){
     const oldIds=new Set(peers.keys());
     m.list.forEach(item=>{
      if(!item||!item.id)return;
      const curP=peers.get(item.id);
      const joinTime=curP?Math.min(curP.joinedAt||Date.now(),item.joinedAt||Date.now()):(item.joinedAt||Date.now());
      peers.set(item.id,{
       presence:item.id===myId?myPres:Object.assign({},curP?.presence||{},item.presence||{}),
       joinedAt:joinTime
      });
      if(item.id!==myId&&!conns.has(item.id)){
       connectTo(item.id);
      }
     });
     const joined=[...peers.keys()].filter(k=>!oldIds.has(k)).map(id=>list().find(x=>x.peer===id)).filter(Boolean);
     electHost();
     emitPeers(joined,[]);
    }else if(m.t==='pres'){
     const prev=peers.get(remoteId)||{joinedAt:Date.now()};
     peers.set(remoteId,{presence:Object.assign({},prev.presence,m.p||{}),joinedAt:prev.joinedAt});
     if(isActingHost)syncPeerTable();
     emitPeers([],[]);
    }else if(m.t==='relay'){
     if(m.mid){
      if(seenMsg.has(m.mid))return;
      seenMsg.add(m.mid);
      if(seenMsg.size>2000){const first=seenMsg.values().next().value;seenMsg.delete(first);}
     }
     deliver(m.topic,m.data,m.from||senderId);
     broadcast(m,remoteId);
    }
   });

   const cleanup=()=>{
    if(dead)return;
    if(conns.get(remoteId)!==c)return;
    conns.delete(remoteId);
    // Keep peer briefly if still in peer table via another connection; otherwise remove
    const leftItem=list().find(x=>x.peer===remoteId);
    if(peers.delete(remoteId)){
     if(isActingHost)syncPeerTable();
     electHost();
     emitPeers([],leftItem?[leftItem]:[]);
    }
   };
   c.on('close',cleanup);
   c.on('error',cleanup);
  };

  const slotCandidates=['0','1','2','3','4','5'].map(s=>`lmr-${cleanCode}-${s}`);

  async function openPeerWithSlot(idx,cfgIdx=0){
   if(cfgIdx>=CFGS.length)throw err('upstream_error','no_broker');
   const cfg=CFGS[cfgIdx];
   return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{
     try{p.destroy();}catch(_){}
     if(cfgIdx+1<CFGS.length)openPeerWithSlot(0,cfgIdx+1).then(resolve,reject);
     else reject(err('upstream_error','timeout'));
    },8000);
    const idToTry=idx<slotCandidates.length?slotCandidates[idx]:`lmr-${cleanCode}-${Math.random().toString(36).slice(2,7)}`;
    const p=new MPeer(idToTry,cfg);
    let settled=false;
    p.on('error',e=>{
     if(settled)return;
     if(e&&e.type==='unavailable-id'&&idx<slotCandidates.length){
      settled=true;
      clearTimeout(timer);
      try{p.destroy();}catch(_){}
      openPeerWithSlot(idx+1,cfgIdx).then(resolve,reject);
     }else if(e&&e.type==='unavailable-id'){
      settled=true;
      clearTimeout(timer);
      try{p.destroy();}catch(_){}
      openPeerWithSlot(slotCandidates.length+1,cfgIdx).then(resolve,reject);
     }else if(cfgIdx+1<CFGS.length){
      settled=true;
      clearTimeout(timer);
      try{p.destroy();}catch(_){}
      openPeerWithSlot(0,cfgIdx+1).then(resolve,reject);
     }else{
      settled=true;
      clearTimeout(timer);
      try{p.destroy();}catch(_){}
      reject(err('upstream_error',e&&e.type||'peer_err'));
     }
    });
    p.on('open',id=>{
     if(settled)return;
     settled=true;
     clearTimeout(timer);
     resolve(p);
    });
   });
  }

  peer=await openPeerWithSlot(0,0);
  myId=peer.id;
  const myJoinedAt=Date.now();
  peers.set(myId,{presence:myPres,joinedAt:myJoinedAt});
  isActingHost=(myId===slotCandidates[0]);
  peer.on('connection',c=>attachConn(c,c.peer));

  const hashPeer=decodeURIComponent((location.hash||'').replace(/^#host-/,''));
  const discoverTargets=()=>new Set([...(peer&&peer.known?peer.known():[]),...peers.keys()].filter(x=>x&&x!==myId));

  const nap=ms=>new Promise(r=>setTimeout(r,ms));
  const t0=Date.now();
  while(Date.now()-t0<3200&&!(peer.known&&peer.known().length))await nap(200);
  discoverTargets().forEach(t=>connectTo(t));
  if(peer.known&&peer.known().length)await nap(1800);
  electHost();

  const probeTimer=setInterval(()=>{
   if(dead)return clearInterval(probeTimer);
   discoverTargets().forEach(t=>{
    const c=conns.get(t);
    if(!c||(!c.open&&c.peerConnection&&c.peerConnection.connectionState==='failed')){
     if(c){try{c.close();}catch(_){}conns.delete(t);}
     connectTo(t);
    }
   });
   if(myPres&&myPres.name){
    broadcast({t:'pres',p:myPres});
   }
  },1800);

  emitConn();

  return {
   name:cleanCode,
   get isHost(){return isActingHost;},
   get peerId(){return myId;},
   emit:async(topic,data)=>{
    if(dead)return;
    const d=JSON.parse(JSON.stringify(data===undefined?null:data));
    const mid=myId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    seenMsg.add(mid);
    deliver(topic,d,myId);
    broadcast({t:'relay',mid,topic,data:d,from:myId});
   },
   on:(t,f)=>{
    (L[t]=L[t]||[]).push(f);
    return()=>{L[t]=(L[t]||[]).filter(x=>x!==f);};
   },
   presence:async p=>{
    myPres=Object.assign({},myPres,p);
    peers.set(myId,{presence:myPres,joinedAt:peers.get(myId)?.joinedAt||myJoinedAt});
    broadcast({t:'pres',p:myPres});
    if(isActingHost)syncPeerTable();
    emitPeers([],[]);
   },
   peers:()=>list(),
   onPeers:h=>{
    hs.add(h);
    setTimeout(()=>{const l=list();h({peers:l,joined:l,left:[],updated:[]});});
    return()=>hs.delete(h);
   },
   connected:()=>!dead&&!!myId,
   onConnection:h=>{
    cs.add(h);
    setTimeout(()=>h(!dead&&!!myId));
    return()=>cs.delete(h);
   },
   leave:async()=>{
    dead=true;
    clearInterval(probeTimer);
    conns.forEach(c=>{try{c.close();}catch(e){}});
    conns.clear();
    try{peer.destroy();}catch(e){}
    emitConn();
   }
  };
 }

 window.claude={use:async n=>n==='room'?{join}:null};
})();
</script>

let AC=null,MASTER=null,SFXBUS=null,MUSBUS=null,NOISE=null;
function ctx(){
 if(AC)return AC;
 try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(comp);comp.connect(AC.destination);
  SFXBUS=AC.createGain();SFXBUS.gain.value=1;SFXBUS.connect(MASTER);
  MUSBUS=AC.createGain();MUSBUS.gain.value=SET.vol*.55;MUSBUS.connect(MASTER);
  const len=AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=buf;
 }catch(e){AC=null;}
 return AC;
}
function tone(f,d=.12,type='square',v=.05,at=0,bus){
 if(!SET.sound||!ctx())return;
 try{const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(bus||SFXBUS);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function noise(d=.08,v=.05,at=0,hp=2000,bus){
 if(!SET.sound||!ctx())return;
 try{const t=AC.currentTime+at,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NOISE;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(bus||SFXBUS);s.start(t,Math.random()*.5);s.stop(t+d+.02);}catch(e){}
}
function playTone(freq,dur,type='sine',vol=.08,at=0,slideTo=null,bus){
 if(!SET.sound||!ctx())return;
 try{
  const t=AC.currentTime+at;
  const o=AC.createOscillator();
  const g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(bus||SFXBUS);
  o.start(t);o.stop(t+dur+.03);
 }catch(e){}
}
function playNoise(dur,vol=.08,at=0,freq=1200,q=1.2,filterType='bandpass',bus){
 if(!SET.sound||!ctx())return;
 try{
  const t=AC.currentTime+at;
  const s=AC.createBufferSource();
  s.buffer=NOISE;
  const f=AC.createBiquadFilter();
  f.type=filterType;f.frequency.setValueAtTime(freq,t);f.Q.value=q;
  const g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(bus||SFXBUS);
  s.start(t,Math.random()*0.4);s.stop(t+dur+.03);
 }catch(e){}
}
function playChime(notes,spacing=.09,dur=.28,type='triangle',vol=.09,at=0){
 notes.forEach((f,idx)=>{
  playTone(f,dur,type,vol,at+idx*spacing,null);
  playTone(f*2,dur*.6,'sine',vol*.28,at+idx*spacing,null);
 });
}

const TRACKS=[
 {n:'ليالي القاهرة',bpm:96,root:50,sc:[0,1,4,5,7,8,10,12,13,16,17,19],rh:'maqsum',style:'oud'},

 {n:'نسمة النيل',bpm:72,root:50,sc:[0,2,3,5,7,8,11,12,14,15,17,19],rh:'slow',style:'ney'}
];
const RHY={
 maqsum:{D:[0,8],T:[2,6,12],K:[4,10,14]},
 baladi:{D:[0,2,8],T:[6,12,14],K:[4,10]},
 slow:{D:[0,10],T:[6],K:[]}
};
const mtof=m=>440*Math.pow(2,(m-69)/12);
let MUS={on:false,timer:null,step:0,next:0,motif:[],bar:0,tr:null};
function drum(kind,t,vol=1){
 if(!AC)return;
 if(kind==='D'){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);
  g.gain.setValueAtTime(.55*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(MUSBUS);o.start(t);o.stop(t+.3);}
 else{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;f.type='bandpass';f.frequency.value=kind==='T'?3400:2200;f.Q.value=1.4;
  g.gain.setValueAtTime((kind==='T'?.35:.16)*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+(kind==='T'?.09:.05));s.connect(f);f.connect(g);g.connect(MUSBUS);s.start(t,Math.random()*.5);s.stop(t+.12);}
}
function pluck(freq,t,dur,vol,style){
 if(!AC)return;
 const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
 if(style==='ney'){o.type='sine';o2.type='triangle';f.frequency.value=2600;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*.9,t+.08);g.gain.setTargetAtTime(.0001,t+dur*.8,.12);
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.5;lg.gain.value=freq*.006;lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);lfo.start(t);lfo.stop(t+dur+.5);}
 else if(style==='mizmar'){o.type='sawtooth';o2.type='square';f.frequency.value=1800;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*.55,t+.02);g.gain.setTargetAtTime(.0001,t+dur*.7,.06);}
 else{o.type='triangle';o2.type='sawtooth';f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(700,t+.4);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.35,dur));}
 f.type='lowpass';o.frequency.value=freq;o2.frequency.value=freq*1.004;
 o.connect(f);o2.connect(f);f.connect(g);g.connect(MUSBUS);
 o.start(t);o2.start(t);o.stop(t+dur+.6);o2.stop(t+dur+.6);
}
function makeMotif(tr){
 const m=[];let idx=4;
 for(let s=0;s<32;s+=2){
  if(Math.random()<.22){m.push(null);continue;}
  idx=Math.max(0,Math.min(tr.sc.length-1,idx+rnd([-2,-1,-1,0,1,1,2])));
  m.push({i:idx,l:rnd([2,2,2,4])});
 }
 return m;
}
function musTick(){
 if(!MUS.on||!AC)return;
 const tr=MUS.tr,spb=60/tr.bpm/4;
 while(MUS.next<AC.currentTime+.35){
  const s=MUS.step%16,t=MUS.next,r=RHY[tr.rh];
  if(r.D.includes(s))drum('D',t,1);else if(r.T.includes(s))drum('T',t,1);else if(r.K.includes(s))drum('K',t,1);
  if(s===0){
   if(MUS.step%64===0)MUS.motif=makeMotif(tr);
   const b=tr.root-12;pluck(mtof(b),t,spb*15,.08,'ney');pluck(mtof(b+7),t,spb*15,.04,'ney');
  }
  const bar2=Math.floor(MUS.step/16)%2,k=(bar2*16+s);
  if(k%2===0){
   const n=MUS.motif[k/2];
   if(n&&(MUS.step%128<112)){const note=tr.root+tr.sc[n.i]+12;pluck(mtof(note),t,spb*n.l,.1,tr.style);
    if(Math.random()<.12)pluck(mtof(note+(tr.sc[n.i+1]-tr.sc[n.i]||1)),t-spb*.5>AC.currentTime?t-spb*.5:t,spb,.05,tr.style);}
  }
  MUS.next+=spb;MUS.step++;
 }
}
function musStart(){
 if(!ctx())return;
 if(AC.state==='suspended')AC.resume();
 if(MUS.on)return;
 MUS.tr=TRACKS[SET.track]||TRACKS[0];MUS.on=true;MUS.step=0;MUS.next=AC.currentTime+.1;MUS.motif=makeMotif(MUS.tr);
 MUS.timer=setInterval(musTick,90);musTick();
}
function musStop(){MUS.on=false;clearInterval(MUS.timer);}
function setMusic(on){SET.music=on;saveSet();on?musStart():musStop();updMusicUI();}
function setTrack(i){SET.track=i;saveSet();const was=MUS.on;musStop();if(was)musStart();updMusicUI();}
function setVol(v){SET.vol=v;saveSet();if(MUSBUS)MUSBUS.gain.value=v*.55;}
document.addEventListener('pointerdown',()=>{ctx();if(AC&&AC.state==='suspended')AC.resume();if(SET.music&&!MUS.on)musStart();},{once:false});

let CUR_AUDIO=null;
function stopAudio(){
 try{if(CUR_AUDIO){CUR_AUDIO.pause();CUR_AUDIO.currentTime=0;CUR_AUDIO=null;}}catch(e){}
 try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
}
function normArLookup(s){
 return String(s||'')
  .replace(/[\u064B-\u065F\u0670]/g,'')
  .replace(/[^\u0621-\u064A\u0660-\u0669\u06F0-\u06F90-9\s]+/g,' ')
  .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/\s+/g,' ').trim();
}
function findAudioFile(rawText){
 const t=String(rawText||'').trim();
 if(!t)return null;
 if(AUDIO_MAP[t])return AUDIO_MAP[t];
 const t3=t.replace(/\{n\}/g,'ثلاثة');
 if(AUDIO_MAP[t3])return AUDIO_MAP[t3];
 const nk=normArLookup(t3);
 for(const [k,v] of Object.entries(AUDIO_MAP)){
  if(normArLookup(k)===nk)return v;
 }
 const pfx=nk.slice(0,26);
 if(pfx){
  for(const [k,v] of Object.entries(AUDIO_MAP)){
   const bnk=normArLookup(k);
   if(bnk.includes(pfx)||nk.includes(bnk.slice(0,26)))return v;
  }
 }
 return null;
}
function playMp3File(src,fall,o={}){
 return new Promise(res=>{
  try{
   if(CUR_AUDIO){CUR_AUDIO.pause();CUR_AUDIO.currentTime=0;CUR_AUDIO=null;}
   const a=new Audio(encodeURI(src));
   CUR_AUDIO=a;
   a.volume=Math.min(1,Math.max(0,(SET.vol??0.6)*(o.vol??1)));
   let done=false;
   const finish=(ok)=>{
    if(done)return;done=true;
    clearTimeout(guard);
    if(CUR_AUDIO===a)CUR_AUDIO=null;
    res(ok);
   };
   const guard=setTimeout(()=>finish(true),Math.max(fall+3500,8500));
   a.onended=()=>finish(true);
   a.onerror=()=>finish(false);
   const p=a.play();
   if(p&&typeof p.then==='function')p.catch(()=>finish(false));
  }catch(e){res(false);}
 });
}
function say(text,o={}){
 const clean=arSpeechText(text);
 const fall=Math.max(2600,clean.length*105);
 return new Promise(async res=>{
  if(!SET.voice||!text){setTimeout(res,fall);return;}
  const mp3=findAudioFile(text);
  if(mp3){
   const played=await playMp3File(mp3,fall,o);
   if(played){res();return;}
  }
  if(!clean||!('speechSynthesis' in window)){setTimeout(res,fall);return;}
  try{
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(clean);
   const v=VOICE||pickVoice();
   u.lang=v?v.lang:'ar-EG';
   if(v)u.voice=v;
   u.pitch=o.pitch||1;
   u.rate=o.rate||0.95;
   u.volume=Math.min(1,Math.max(0,SET.vol??1));
   let done=false,started=false;
   const end=()=>{if(done)return;done=true;clearTimeout(guard);res();};
   const guard=setTimeout(end,fall+6500);
   u.onstart=()=>{started=true;};
   u.onend=end;
   u.onerror=end;
   speechSynthesis.speak(u);
   setTimeout(()=>{if(!started&&!done)end();},1400);
  }catch(e){setTimeout(res,fall);}
 });
}

}

   let r=rentFor(t,dice,o);

async function applyCard(p,c){
 const last=S.last||7;
 switch(c.k){
  case 'money':if(c.v>0)gain(p,c.v);else await charge(p,-c.v,'pool','كارت');break;
  case 'goto':await moveTo(p,c.to);await land(p,last);break;
  case 'back':await moveBack(p,c.v);await land(p,last);break;
  case 'jail':await sendJail(p);break;
  case 'free':
   if(p.free>=1)gain(p,50,'معاك كارت واسطة أصلًا فخد 50 ج');
   else{p.free=1;fx('sfx','fan');await cut('free',{title:'كارت واسطة 🎫',lines:[{t:'احتفظ بيه لحد ما تتزنق في القسم.'}],m1:'#1d6a6a'});refresh();}
   break;
  case 'each':
   for(const o of alive()){if(o===p||p.out)continue;if(c.v>0)await charge(o,c.v,p,'كارت');else await charge(p,-c.v,o,'كارت');}
   break;
  case 'repair':{
   let h=0,t=0;for(const i of mine(p)){const l=lvl(i);if(l===5)t++;else h+=l;}
   const cost=h*c.h+t*c.hot;
   if(cost>0)await charge(p,cost,'pool','صيانة');else logm('معندكش بيوت.. نجوت من الصيانة!');
   break;}
  case 'near':{
   let to=p.pos;do{to=(to+1)%40;}while(TILES[to].t!==c.w);
   await moveTo(p,to);await land(p,last,{mult:c.w==='st'?2:10});break;}
 }
}

function canBuild(p,t){
 if(!t||t.t!=='prop'||S.own[t.i]!==p.id||!hasSet(p,t.g))return false;
 const g=GROUP_TILES(t.g);if(g.some(x=>S.mort[x.i]))return false;
 return lvl(t.i)<5&&lvl(t.i)<=Math.min(...g.map(x=>lvl(x.i)))&&p.cash>=t.hc;
}
function canSell(p,t){
 if(!t||t.t!=='prop'||S.own[t.i]!==p.id||lvl(t.i)===0)return false;
 return lvl(t.i)>=Math.max(...GROUP_TILES(t.g).map(x=>lvl(x.i)));
}
function canMort(p,t){
 if(!t||S.own[t.i]!==p.id||S.mort[t.i])return false;
 if(t.g&&GROUP_TILES(t.g).some(x=>lvl(x.i)>0))return false;return true;
}

function aiBuy(p,t){
 if(p.cash<t.p)return false;
 const left=p.cash-t.p;
 if(t.g){
  const own=GROUP_TILES(t.g).filter(x=>S.own[x.i]===p.id).length;
  if(own===GROUP_TILES(t.g).length-1)return left>=0;
  return left>=120;
 }
 return left>=180;
}
function aiTradeOk(who,buyer,t,amt){
 let need=t.p*1.4;
 if(t.g){const g=GROUP_TILES(t.g);if(g.filter(x=>S.own[x.i]===who.id).length>1)need=t.p*2.5;
  if(g.filter(x=>S.own[x.i]===buyer.id).length===g.length-1)need=t.p*3.5;}
 return amt>=need;
}
async function aiManage(p){
 const sets=Object.keys(GR).filter(g=>hasSet(p,g));
 for(const g of sets){
  let guard=0;
  while(guard++<12){
   const ts=GROUP_TILES(g).filter(t=>canBuild(p,t)&&p.cash-t.hc>=150);
   if(!ts.length)break;await doBuild(p,ts.sort((a,b)=>lvl(a.i)-lvl(b.i))[0]);
  }
 }
 for(const i of mine(p)){const t=TILES[i];if(S.mort[i]&&p.cash>Math.ceil(t.p*.55)+400)doUnmort(p,t);}
}
function aiLiquidate(p,need){
 let g=0;
 while(p.cash<need&&g++<60){
  const s=mine(p).map(i=>TILES[i]).filter(t=>canSell(p,t))[0];
  if(s){doSell(p,s);continue;}
  const m=mine(p).map(i=>TILES[i]).filter(t=>canMort(p,t)).sort((a,b)=>a.p-b.p)[0];
  if(m){doMort(p,m);continue;}break;
 }
}

let RUN=0;
async function turnLoop(){
 if(NET.on&&!NET.host)return;
 const my=RUN;
 while(my===RUN&&S&&!S.over){
  if(NET.on&&!NET.host)return;
  const p=cur();
  if(!p)break;
  if(p.out){S.turn=(S.turn+1)%S.pl.length;continue;}
  save();refresh();
  await playTurn(p,my);
  if(my!==RUN||!S||S.over)return;
  if(!S.again)S.turn=(S.turn+1)%S.pl.length;
 }
}
async function playTurn(p,my){

 if(p.cpu){await sleep(800);await aiManage(p);}

  else if(act==='pay'){if(await charge(p,JAIL_FINE,'pool','كفالة'))p.jail=0;else return;}
  else{
   const [a,b]=await rollAnim();S.last=a+b;
   if(a===b){p.jail=0;logm(`🎲 ${p.name} طلع من القسم بدبلة!`);await moveBy(p,a+b);await land(p,a+b);return;}
   p.jail--;
   if(p.jail<=0){await charge(p,JAIL_FINE,'pool','كفالة إجبارية');p.jail=0;if(p.out)return;await moveBy(p,a+b);await land(p,a+b);return;}
   logm(`${p.name} لسه في القسم`);setStatus('لسه في القسم.. 😴');await sleep(900);return;
  }
 }
 if(!p.cpu){
  const r=await chooseActs(p,[{t:'🎲 ارمي النرد',v:'roll'},{t:'🏗️ إدارة',c:'alt',v:'man'}]);
  if(r==='man'){await manage(p);return playTurn(p,my);}
 }
 const [a,b]=await rollAnim();S.last=a+b;
 setStatus(`${a} + ${b} = ${a+b}${a===b?' (دبلة! 🔥)':''}`);await sleep(450);
 if(a===b){
  dbl++;
  if(dbl>=3){logm(`${p.name} جاب 3 دبل ورا بعض!`);await sendJail(p,'الشك في نزاهة النرد بعد 3 دبل ورا بعض');return;}
  S.again=true;S.dbl=dbl;
 }
 await moveBy(p,a+b);
 if(my!==RUN)return;
 await land(p,a+b);

let ROOM=null,ROOT=null,NETOFF=[];

}
async function netOpen(){

 return !!ROOT;
}
function netClose(){
 NETOFF.forEach(f=>{try{f();}catch(e){}});NETOFF=[];
 if(ROOM){try{ROOM.leave();}catch(e){}}

}

}
function newCode(){
 const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let s='';for(let i=0;i<4;i++)s+=c[Math.random()*c.length|0];
 return s;
}

function takeOverHostDuty(){
 if(!NET.on||!ROOM)return;
 const nowHost=!!ROOM.isHost;
 const prevHost=NET.host;
 NET.host=nowHost;
 if(nowHost&&!prevHost){
  if(S&&!S.over){
   const usedPeers=new Set(S.pl.map(x=>x.peer).filter(Boolean));
   S.pl.forEach(p=>{
    if(!p.cpu&&!p.peer){
     const match=ROOM.peers().find(x=>x.peer&&!usedPeers.has(x.peer)&&x.presence&&x.presence.name===p.name)
      ||ROOM.peers().find(x=>x.peer&&!usedPeers.has(x.peer));
     if(match){p.peer=match.peer;usedPeers.add(match.peer);}
    }
   });
   NET.seat=S.pl.findIndex(p=>p.peer===NET.peer);
   logm('👑 تم توريث إدارة الغرفة تلقائياً لمواصلة اللعب بدون توقف');
   netSend('st',snapshot());
   RUN++;
   turnLoop();
  }else if(!S){
   renderLobby();
  }
 }else if(!nowHost&&prevHost){
  RUN++;
 }
}

async function netJoin(code){
 if(!ROOT&&!(await netOpen()))return 'unavailable';
 try{ROOM=await ROOT.join('bk-'+code.toLowerCase());}catch(e){return 'failed';}
 NET.on=true;
 NET.code=code.toUpperCase();
 NET.lobby=[];
 NET.peer=ROOM.peerId||null;
 NET.host=!!ROOM.isHost;

 NETOFF.push(ROOM.onPeers(ch=>{
  NET.peer=ROOM.peerId||NET.peer;
  ch.left.forEach(p=>onPeerLeft(p.peer));
  takeOverHostDuty();
  if(!S)renderLobby();
  else{
   if(NET.host&&ch.joined&&ch.joined.length){
    S.pl.forEach(p=>{
     if(!p.cpu&&!p.peer){
      const match=ch.joined.find(j=>j.presence&&j.presence.name===p.name);
      if(match)p.peer=match.peer;
     }
    });
    netSend('st',snapshot());
   }
   renderPanel();
  }
 },()=>{}));

 NETOFF.push(ROOM.on('__host_promoted__',()=>{
  takeOverHostDuty();
 }));

 ROOM.presence({name:SET.name||'لاعب',host:NET.host,t:Date.now()}).catch(()=>{});

 NETOFF.push(ROOM.on('cm',m=>{if(NET.host)onCmd(m);}));
 NETOFF.push(ROOM.on('an',m=>{
  if(!NET.host)return;
  const d=m.data||{},pd=NET.pend.get(d.id);
  if(pd&&pd.peer===m.peer){NET.pend.delete(d.id);pd.res(d.v);}
 }));
 NETOFF.push(ROOM.on('st',m=>{
  if(m.isMe||NET.host)return;
  applySnap(m.data);
 }));
 NETOFF.push(ROOM.on('ev',m=>{
  const d=m.data||{};if(m.isMe||!FX[d.k]||!S&&d.k!=='over')return;
  if(d.k==='cut'||d.k==='card'||d.k==='over'){FX[d.k](...d.a);}else FX[d.k](...d.a);
 }));
 NETOFF.push(ROOM.on('pr',m=>{
  const d=m.data;if(!d||d.to!==NET.peer)return;
  NET.seenPr=NET.seenPr||new Map();const key=m.peer+':'+d.id,old=NET.seenPr.get(key);
  if(old){if(old.done)netSend('an',{id:d.id,v:old.v});return;}
  NET.seenPr.set(key,{done:false});
  onPrompt(d).then(v=>{NET.seenPr.set(key,{done:true,v});});
 }));
 NETOFF.push(ROOM.on('lb',m=>{if(S&&!NET.host&&!m.isMe)endToLobby();}));
 NETOFF.push(ROOM.on('rx',m=>{
  const d=m.data||{};if(S)FX.rx(String(d.e||'🙂').slice(0,4),String(d.n||'').slice(0,14));
 }));

 setTimeout(()=>{
  NET.peer=ROOM.peerId||NET.peer;
  takeOverHostDuty();
  if(!S)renderLobby();
 },400);

 return 'ok';
}

setInterval(()=>{if(NET.on&&NET.host&&S&&!S.over)netSend('st',snapshot());},4000);
setInterval(()=>{if(!(NET.on&&NET.host&&S&&!S.over&&ROOM))return;let ch=false;const ps=ROOM.peers();
 ps.forEach(j=>{const nm=j.presence&&j.presence.name;if(!nm||j.isMe||S.pl.some(x=>x.peer===j.peer))return;
  const q=S.pl.find(x=>x.wasHuman===nm||(!x.cpu&&x.peer&&x.name===nm&&!ps.some(pp=>pp.peer===x.peer)));
  if(q){q.cpu=false;q.peer=j.peer;q.name=nm;delete q.wasHuman;logm('🔄 '+nm+' رجع للعبة');ch=true;}});
 if(ch){refresh();netSend('st',snapshot());}},2000);
setInterval(()=>{if(NET.on&&NET.host&&!S&&ROOM)netSend('lb',{});},3000);
window.addEventListener('pagehide',()=>{try{window.__MP&&window.__MP.destroy();}catch(e){}});
function onPeerLeft(peer){
 if(!NET.host||!S)return;
 const p=S.pl.find(x=>x.peer===peer&&!x.cpu);
 if(!p)return;
 p.cpu=true;p.wasHuman=p.wasHuman||p.name;
 if(!p.name.includes('🤖'))p.name=p.name+' 🤖';
 logm(`📴 ${p.name} خرج.. الكمبيوتر كمّل مكانه`);
 for(const [id,pd] of NET.pend){
  if(pd.peer===peer){
   NET.pend.delete(id);
   const b=(pd.btns||[]).find(x=>!x.d);
   pd.res(pd.kind==='man'?'ok':b?b.v:1);
  }
 }
 refresh();
}

async function onPrompt(d){
 let v;
 try{
  if(d.kind==='ask')v=await ask((d.deed!==undefined?deedHTML(TILES[d.deed]):'')+d.html,d.btns);
  else if(d.kind==='acts')v=await setActs(d.btns);
  else if(d.kind==='man'){const me=S.pl[NET.seat];v=me?await manageUI(me,d.need||0,true):'ok';}
 }catch(e){v=undefined;}
 netSend('an',{id:d.id,v});setTimeout(()=>netSend('an',{id:d.id,v}),1500);return v;
}
